server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    out-of-order: true

  mvc:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:https://kappa.com}"

# Email Configuration — sent via Brevo's HTTP API (not raw SMTP), because
# Railway blocks outbound SMTP ports (587/465) at the network level. The API
# travels over HTTPS (443), which is never blocked. See BrevoApiEmailService.
# BREVO_API_KEY must be generated in Brevo under Settings > SMTP & API > API Keys
# (this is a different key from any SMTP credentials).
app.email:
  from: ${MAIL_FROM:noreply@kappa.com}
  from-name: ${MAIL_FROM_NAME:Kappa}
  brevo-api-key: ${BREVO_API_KEY}

# Stripe Configuration - PRODUCTION
stripe:
  enabled: true
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:https://kappa.com/billing/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:https://kappa.com/billing/cancel}

# Base URL for email links
app:
  base-url: ${APP_BASE_URL:https://kappa.com}

# Jira Configuration
jira:
  # Optional in prod: app can run with per-org/per-user Jira credentials stored in DB.
  base-url: ${JIRA_BASE_URL:}
  user-email: ${JIRA_USER_EMAIL:}
  pat: ${JIRA_PAT:}
  project-key: ${JIRA_PROJECT_KEY}

# OAuth Configuration
oauth2:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}

# Jira OAuth2 (used by AtlassianOAuth2Properties with prefix "atlassian.oauth2")
atlassian:
  oauth2:
    client-id: ${ATLASSIAN_CLIENT_ID:}
    client-secret: ${ATLASSIAN_CLIENT_SECRET:}
    redirect-uri: ${ATLASSIAN_REDIRECT_URI:https://kappa-production.up.railway.app/api/v1/jira/oauth/callback}
    frontend-success-url: ${ATLASSIAN_FRONTEND_SUCCESS_URL:https://www.kappa-app.com/settings/jira?oauth=success}
    frontend-error-url: ${ATLASSIAN_FRONTEND_ERROR_URL:https://www.kappa-app.com/settings/jira?oauth=error}

# Logging
logging:
  level:
    com.company.sprintreporter: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
