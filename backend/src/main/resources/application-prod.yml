server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:https://kappa.com}"

# Email Configuration
spring.mail:
  host: ${MAIL_HOST:smtp-relay.brevo.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  from: ${MAIL_FROM:noreply@kappa.com}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

# Stripe Configuration - PRODUCTION
stripe:
  enabled: true
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:https://kappa.com/billing/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:https://kappa.com/billing/cancel}

# Base URL for email links
app:
  base-url: ${APP_BASE_URL:https://kappa.com}

# Jira Configuration
jira:
  base-url: ${JIRA_BASE_URL}
  user-email: ${JIRA_USER_EMAIL}
  pat: ${JIRA_PAT}
  project-key: ${JIRA_PROJECT_KEY}

# OAuth Configuration
oauth2:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
  atlassian:
    client-id: ${ATLASSIAN_CLIENT_ID}
    client-secret: ${ATLASSIAN_CLIENT_SECRET}

# Logging
logging:
  level:
    com.company.sprintreporter: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
