server:
  port: 8080

spring:
  application:
    name: kappa
  mvc:
    cors:
      allowed-origins: "http://localhost:4200"

  # PostgreSQL DataSource
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sprintreporter}
    username: ${DATABASE_USERNAME:sprintreporter}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jira:
  base-url: ${JIRA_BASE_URL:https://your-company.atlassian.net}
  pat: ${JIRA_PAT:}
  api-token: ${JIRA_API_TOKEN:mock-token}
  user-email: ${JIRA_USER_EMAIL:user@company.com}
  project-key: ${JIRA_PROJECT_KEY:SCRUM}
  sprint-id: ${JIRA_SPRINT_ID:42}
  mock-mode: ${JIRA_MOCK_MODE:true}

metrics:
  capacity:
    planned: ${METRICS_CAPACITY_PLANNED:0}
    real: ${METRICS_CAPACITY_REAL:0}
  team-availability:
    dev: ${METRICS_TEAM_DEV:0}
    pda: ${METRICS_TEAM_PDA:0}
    qa: ${METRICS_TEAM_QA:0}

capacity:
  days-per-sprint: ${CAPACITY_DAYS_PER_SPRINT:10}
  holidays: ${CAPACITY_HOLIDAYS:2026-07-14}

atlassian:
  oauth2:
    client-id: ${ATLASSIAN_CLIENT_ID:}
    client-secret: ${ATLASSIAN_CLIENT_SECRET:}
    redirect-uri: ${ATLASSIAN_REDIRECT_URI:http://localhost:8080/api/v1/jira/oauth/callback}
    frontend-success-url: ${ATLASSIAN_FRONTEND_SUCCESS_URL:http://localhost:4200/settings/jira?oauth=success}
    frontend-error-url: ${ATLASSIAN_FRONTEND_ERROR_URL:http://localhost:4200/settings/jira?oauth=error}

jwt:
  secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeAtLeast32CharsLong!}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  email-verification:
    expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}
  email:
    from: ${MAIL_FROM:noreply@kappa.com}

# SMTP settings, used only outside production (see SmtpEmailService). Production
# sends via Brevo's HTTP API instead — see BrevoApiEmailService.
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
    mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

stripe:
  enabled: ${STRIPE_ENABLED:false}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/billing/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/billing/cancel}

logging:
  level:
    com.company.sprintreporter: DEBUG
    org.springframework.web: INFO
