server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security hardening ──────────────────────────────────────────────
    server_tokens off;

    # Strict Transport Security (enable once behind HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers — defined once at server level, apply to all locations
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Gzip compression ───────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── Proxy API calls to backend ─────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Hide backend server identity
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Block large request bodies (prevent upload abuse)
        client_max_body_size 1m;
    }

    # ── Angular SPA — always serve index.html for client-side routing ──
    location / {
        try_files $uri $uri/ /index.html;
        expires -1; # Cache-Control: no-cache — ensures fresh deploys
    }

    # ── Cache static assets aggressively ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
    }

    # ── Block access to dotfiles ───────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}

