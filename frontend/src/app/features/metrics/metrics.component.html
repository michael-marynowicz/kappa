<div class="metrics-page">
  <header class="metrics__header">
    <div>
      <h1 class="page-title">{{ "metrics.title" | translate }}</h1>
      <p class="page-subtitle">
        {{ "metrics.subtitle" | translate }}
      </p>
    </div>

    <div class="header-actions">
      <app-team-dashboard-switcher
        [dashboards]="dashboards()"
        [loading]="dashboardsLoading()"
        [switchingDashboardId]="switchingDashboardId()"
        [isAdmin]="isAdmin"
        [errorMessage]="dashboardError()"
        (switchDashboard)="onSwitchTeam($event)"
      />
    </div>

    <div class="metrics__spacer" aria-hidden="true"></div>
  </header>

  <!-- Segmented control -->
  <nav class="chart-switcher" aria-label="Chart view selector">
    @for (opt of viewOptions; track opt.value) {
      <button
        class="chart-switcher__btn"
        [class.chart-switcher__btn--active]="focusView() === opt.value"
        (click)="focusView.set(opt.value)"
        [attr.aria-pressed]="focusView() === opt.value"
      >
        {{ opt.label }}
      </button>
    }
  </nav>

  @if (state.error()) {
    <div class="error-banner" role="alert">
      <span>⚠ {{ state.error() }}</span>
      <button (click)="state.clearError()">✕</button>
    </div>
  }

  @if (showAnalyticsSkeleton()) {
    <section class="metrics-skeleton" aria-live="polite" aria-busy="true">
      <div class="metrics-skeleton__row metrics-skeleton__row--summary">
        <div class="metrics-skeleton__card"></div>
        <div class="metrics-skeleton__card"></div>
        <div class="metrics-skeleton__card"></div>
      </div>

      <div class="metrics-skeleton__row metrics-skeleton__row--chart">
        <div class="metrics-skeleton__chart"></div>
        <div class="metrics-skeleton__list">
          <span class="metrics-skeleton__line"></span>
          <span class="metrics-skeleton__line"></span>
          <span class="metrics-skeleton__line"></span>
          <span class="metrics-skeleton__line"></span>
        </div>
      </div>

      <div class="metrics-skeleton__row metrics-skeleton__row--table">
        <span
          class="metrics-skeleton__line metrics-skeleton__line--full"
        ></span>
        <span
          class="metrics-skeleton__line metrics-skeleton__line--full"
        ></span>
        <span
          class="metrics-skeleton__line metrics-skeleton__line--full"
        ></span>
      </div>
    </section>
  } @else {
    <div
      class="feature-gate"
      [class.feature-gate--disabled]="state.metricsGated()"
    >
      <app-sprint-analytics
        [metrics]="state.metrics()"
        [iterations]="state.iterations()"
        [epicGroups]="state.epicGroups()"
        [iterationsGated]="state.iterationsGated()"
        [iterationsLoading]="state.iterationsLoading()"
        [capacityGated]="state.iterationsGated()"
        [focusView]="focusView()"
      />
      @if (state.metricsGated()) {
        <app-premium-overlay message="Metrics require a Premium plan" />
      }
    </div>
  }
</div>
