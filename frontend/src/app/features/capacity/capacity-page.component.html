<div class="capacity-page">
  <header class="capacity__header">
    <div>
      <h1 class="page-title">Capacity Planning</h1>
      <p class="page-subtitle">
        Manage team availability and plan sprint capacity
      </p>
    </div>

    <div class="header-actions">
      <app-team-dashboard-switcher
        [dashboards]="dashboards()"
        [loading]="dashboardsLoading()"
        [switchingDashboardId]="switchingDashboardId()"
        [isAdmin]="isAdmin"
        [errorMessage]="dashboardError()"
        (switchDashboard)="onSwitchTeam($event)"
      />
    </div>

    <button class="btn-export" (click)="onExportCsv()">
      <span>Export CSV</span>
    </button>
  </header>

  <app-capacity-grid />
</div>
