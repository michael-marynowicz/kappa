<div class="capacity-page">
  <header class="capacity__header">
    <div>
      <h1 class="page-title">{{ "capacity.title" | translate }}</h1>
      <p class="page-subtitle">
        {{ "capacity.subtitle" | translate }}
      </p>
    </div>

    <div class="header-actions">
      <app-team-dashboard-switcher
        [dashboards]="dashboards()"
        [loading]="dashboardsLoading()"
        [switchingDashboardId]="switchingDashboardId()"
        [isAdmin]="isAdmin"
        [errorMessage]="dashboardError()"
        (switchDashboard)="onSwitchTeam($event)"
      />
    </div>

    <button class="btn-export" (click)="onExportCsv()" title="Export full sprint report as CSV">
      <svg
        class="btn-export__icon"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M8 1v9M8 10l-3-3M8 10l3-3"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>{{ "common.export_csv" | translate }}</span>
    </button>
  </header>

  @if (activeDashboardId) {
    <app-capacity-grid />
  } @else if (!dashboardsLoading()) {
    <div class="no-dashboard">
      <svg
        class="no-dashboard__icon"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
      </svg>
      <h2 class="no-dashboard__title">
        {{ "dashboard.no_dashboard" | translate }}
      </h2>
      <p class="no-dashboard__hint">
        {{ "dashboard.no_dashboard_hint" | translate }}
      </p>
      <a class="no-dashboard__cta" routerLink="/settings/jira">{{
        "dashboard.go_to_settings" | translate
      }}</a>
    </div>
  }
</div>
