<div class="language-settings">
  <h2 class="section-title">Language</h2>
  <p class="section-desc">Choose your preferred application language.</p>

  @if (error()) {
    <div class="feedback feedback--error" role="alert">{{ error() }}</div>
  }
  @if (success()) {
    <div class="feedback feedback--success" role="status">{{ success() }}</div>
  }

  @if (loading()) {
    <div class="loading">Loading language preference...</div>
  } @else {
    <form class="language-form" (ngSubmit)="onSave()" #formRef="ngForm">
      <div class="form-group">
        <label class="form-label" for="language">Interface language</label>
        <select
          class="form-select"
          id="language"
          name="language"
          [(ngModel)]="language"
          required
        >
          <option value="fr">Francais</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit" [disabled]="saving() || formRef.invalid">
          {{ saving() ? "Saving..." : "Save language" }}
        </button>
      </div>
    </form>
  }
</div>
