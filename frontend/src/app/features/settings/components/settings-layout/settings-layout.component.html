<div class="settings">
  <header class="settings__header">
    <h1 class="settings__title">{{ "settings.title" | translate }}</h1>
    <p class="settings__subtitle">{{ "settings.subtitle" | translate }}</p>
  </header>

  <nav class="settings__tabs">
    <a
      class="settings-tab"
      routerLink="jira"
      routerLinkActive="settings-tab--active"
    >
      {{ "settings.tab.jira" | translate }}
    </a>
    @if (showBillingTab) {
      <a
        class="settings-tab"
        routerLink="billing"
        routerLinkActive="settings-tab--active"
      >
        {{ "settings.tab.billing" | translate }}
      </a>
    }
    <a
      class="settings-tab"
      routerLink="language"
      routerLinkActive="settings-tab--active"
    >
      {{ "settings.tab.language" | translate }}
    </a>
    @if (isAdmin) {
      <a
        class="settings-tab"
        routerLink="members"
        routerLinkActive="settings-tab--active"
      >
        {{ "settings.tab.members" | translate }}
      </a>
    }
  </nav>

  <div class="settings__content">
    <router-outlet />
  </div>
</div>
