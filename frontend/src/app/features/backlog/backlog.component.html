<div class="backlog">
  <header class="backlog__header">
    <div class="header-text">
      <h1 class="page-title">Sprint Backlog</h1>
      <p class="page-subtitle">Track and manage sprint issues</p>
    </div>
    <button class="btn-export" (click)="onExportCsv()">
      <span>Export CSV</span>
    </button>
  </header>

  @if (state.error()) {
    <div class="error-banner" role="alert">
      <span>⚠ {{ state.error() }}</span>
      <button (click)="state.clearError()">✕</button>
    </div>
  }

  <app-sprint-summary-card [summary]="state.summary()" />

  @if (state.loading()) {
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading backlog…</p>
    </div>
  } @else {
    <app-sprint-issue-table
      [issues]="state.issues()"
      [savingIssueKey]="state.savingIssueKey()"
      (updateRemainingSp)="onUpdateSp($event)"
    />
  }
</div>
