<div class="backlog">
  <header class="backlog__header">
    <div class="header-text">
      <h1 class="page-title">{{ "backlog.title" | translate }}</h1>
      <p class="page-subtitle">{{ "backlog.subtitle" | translate }}</p>
    </div>

    <div class="header-actions">
      <app-team-dashboard-switcher
        [dashboards]="dashboards()"
        [loading]="dashboardsLoading()"
        [switchingDashboardId]="switchingDashboardId()"
        [isAdmin]="isAdmin"
        [errorMessage]="dashboardError()"
        (switchDashboard)="onSwitchTeam($event)"
      />
    </div>

    <button class="btn-export" (click)="onExportCsv()">
      <span>{{ "common.export_csv" | translate }}</span>
    </button>
  </header>

  @if (state.error()) {
    <div class="error-banner" role="alert">
      <span>⚠ {{ state.error() }}</span>
      <button (click)="state.clearError()">✕</button>
    </div>
  }

  <app-sprint-summary-card
    [summary]="state.summary()"
    [loading]="state.loading()"
  />

  @if (state.loading()) {
    <section class="backlog-skeleton" aria-busy="true" aria-live="polite">
      @for (row of [1, 2, 3, 4, 5, 6, 7, 8]; track row) {
        <div class="backlog-skeleton__row">
          <span class="backlog-skeleton__cell bsk--key"></span>
          <span class="backlog-skeleton__cell bsk--title"></span>
          <span class="backlog-skeleton__cell bsk--badge"></span>
          <span class="backlog-skeleton__cell bsk--num"></span>
        </div>
      }
    </section>
  } @else {
    <app-sprint-issue-table
      [issues]="state.issues()"
      [savingIssueKey]="state.savingIssueKey()"
      (updateRemainingSp)="onUpdateSp($event)"
    />
  }
</div>
