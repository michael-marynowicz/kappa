<!-- Mobile backdrop -->
<div
  class="sidebar-backdrop"
  [class.sidebar-backdrop--visible]="mobileOpen"
  (click)="mobileOpen = false"
></div>

<aside class="sidebar" [class.sidebar--open]="mobileOpen">
  <div class="sidebar__brand">
    <div class="brand-icon">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 2L2 7l10 5 10-5-10-5z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-title">Kappa</span>
      <span class="brand-org">{{
        orgName || ("sidebar.no_org" | translate)
      }}</span>
    </div>
    <!-- Mobile close button -->
    <button
      class="sidebar__close"
      (click)="mobileOpen = false"
      aria-label="Close menu"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Main navigation">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        [attr.aria-current]="isActive(item.route) ? 'page' : null"
        [routerLinkActiveOptions]="{ exact: item.route === '/sprint' }"
        (click)="mobileOpen = false"
      >
        <span
          class="nav-item__icon"
          [innerHTML]="item.icon"
          aria-hidden="true"
        ></span>
        <span class="nav-item__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    @if (user) {
      <div class="user-info">
        <div
          class="user-avatar"
          [attr.title]="user.firstName + ' ' + user.lastName"
        >
          {{ user.firstName[0] }}{{ user.lastName[0] }}
        </div>
        <div class="user-details">
          <span class="user-name" [title]="user.firstName + ' ' + user.lastName"
            >{{ user.firstName }} {{ user.lastName }}</span
          >
          <span class="user-email" [title]="user.email">{{ user.email }}</span>
        </div>
      </div>
      <button
        class="btn-logout"
        (click)="logout.emit()"
        title="Sign out"
        aria-label="Sign out"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    }
  </div>
</aside>
