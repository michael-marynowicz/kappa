<div class="shell">
  <!-- Mobile top bar -->
  <header class="shell__mobile-header">
    <button
      class="shell__hamburger"
      (click)="sidebar.mobileOpen = true"
      aria-label="Open navigation menu"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <span class="shell__mobile-title">Kappa</span>
  </header>

  <app-sidebar
    #sidebar
    [user]="authState.user()"
    [orgName]="orgState.organization()?.name ?? ''"
    (logout)="authState.logout()"
  />
  <main class="shell__main">
    <a class="skip-link" href="#main-content">Skip to content</a>

    @if (showEmailBanner) {
      <div class="email-banner">
        <div class="email-banner__content">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span>{{ "shell.email_banner.message" | translate }}</span>
        </div>
        @if (resendSuccess) {
          <span class="email-banner__sent">{{
            "shell.email_banner.sent" | translate
          }}</span>
        } @else {
          <button
            class="email-banner__btn"
            (click)="resendVerification()"
            [disabled]="resendingEmail"
          >
            {{
              resendingEmail
                ? ("shell.email_banner.sending" | translate)
                : ("shell.email_banner.resend" | translate)
            }}
          </button>
        }
      </div>
    }

    @if (showJiraBanner) {
      <div class="jira-banner">
        <div class="jira-banner__content">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ "jira.banner.message" | translate }}</span>
        </div>
        <a class="jira-banner__btn" routerLink="/settings/jira">{{
          "jira.banner.action" | translate
        }}</a>
      </div>
    }

    <div id="main-content">
      <router-outlet />
    </div>
  </main>
</div>
