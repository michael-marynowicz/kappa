<h2 mat-dialog-title>Assign Enterprise Plan</h2>

<mat-dialog-content>
  <p class="text-gray-600 mb-4">
    Organization: <strong>{{ data.orgName }}</strong>
  </p>

  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Plan Code</mat-label>
      <mat-select formControlName="planCode">
        @for (plan of planOptions; track plan) {
          <mat-option [value]="plan">{{ plan }}</mat-option>
        }
      </mat-select>
      @if (form.get("planCode")?.hasError("required")) {
        <mat-error>Plan code is required</mat-error>
      }
    </mat-form-field>
  </form>

  <p class="text-sm text-gray-500 mt-2">
    This will assign an Enterprise subscription with manual billing (no Stripe).
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="confirm()"
    [disabled]="form.invalid"
  >
    Assign Enterprise
  </button>
</mat-dialog-actions>
